services:
  bus_booking:
    image: shaikmustafa/paytm:bus
    ports:
      - "1111:80"
    deploy:
      replicas: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 124M
        reservations:
          cpus: "0.25"
          memory: 64M  
    networks:
      - bus-newwork
    volumes:
      - bus:/opt/naresh/volumes  
    secrets:
      - sql_password  

  movie_booking:
    image: shaikmustafa/paytm:movie
    ports:
      - "2222:80"
    deploy:
      replicas: 2
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 124M
        reservations:
          cpus: "0.25"
          memory: 64M

    networks:
      - movie-network  
    volumes:
      - movie:/opt/naresh/volumes
    secrets:
      - sql_password  


  bank:
    image: shaikmustafa/paytm:bank
    ports:
      - "3333:80"
    deploy:
      replicas: 3  
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 124M
        reservations:
          cpus: "0.25"
          memory: 64M

    networks:
      - bank-network  
    volumes:
      - bank:/opt/naresh/volumes 
    secrets:
      - sql_password 

networks:
  bus-newwork:
    driver: overlay
  movie-network:
    driver: overlay
  bank-network:
    driver: overlay  

volumes:
  bus:
  movie:
  bank:  

secrets:
  sql_password:
    external: true 




      
